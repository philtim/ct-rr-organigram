name: Release Please

# release-please reads conventional commits on main and maintains a rolling
# "release PR" that bumps package.json + writes CHANGELOG.md. When that PR
# is merged it tags vX.Y.Z and creates a GitHub release with the changelog.
# This workflow then builds the ZIP, attaches it to the release, and uploads
# it to the rr-demo test instance.

on:
    push:
        branches: [main]

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        steps:
            - uses: googleapis/release-please-action@v4
              id: release
              with:
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

            - uses: actions/checkout@v4
              if: ${{ steps.release.outputs.release_created }}

            - uses: actions/setup-node@v4
              if: ${{ steps.release.outputs.release_created }}
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              if: ${{ steps.release.outputs.release_created }}
              run: npm ci

            - name: Build & package ZIP
              if: ${{ steps.release.outputs.release_created }}
              env:
                  VITE_KEY: rr-dashboard
                  VITE_BASE_URL: https://placeholder.church.tools
              run: npm run deploy

            - name: Locate ZIP artefact
              id: pkg
              if: ${{ steps.release.outputs.release_created }}
              run: echo "path=$(ls releases/*.zip | head -1)" >> "$GITHUB_OUTPUT"

            - name: Attach ZIP to GitHub release
              if: ${{ steps.release.outputs.release_created }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ steps.release.outputs.tag_name }}
                  ZIP_PATH: ${{ steps.pkg.outputs.path }}
              run: gh release upload "$TAG" "$ZIP_PATH" --clobber

            # Self-bootstraps: creates the custom module on first run if
            # nothing matches the configured shorty.
            - name: Upload ZIP to rr-demo test instance
              if: ${{ steps.release.outputs.release_created }}
              env:
                  CT_BASE_URL: ${{ secrets.CT_DEMO_BASE_URL }}
                  CT_LOGIN_TOKEN: ${{ secrets.CT_DEMO_LOGIN_TOKEN }}
                  ZIP_PATH: ${{ steps.pkg.outputs.path }}
                  SHORTY: rr-dashboard
                  MODULE_NAME: RR Organigram
              run: |
                  set -euo pipefail

                  COOKIE_JAR=$(mktemp)
                  trap 'rm -f "$COOKIE_JAR"' EXIT

                  echo "Authenticating against $CT_BASE_URL..."
                  curl -fsS -c "$COOKIE_JAR" \
                      "$CT_BASE_URL/api/whoami?login_token=$CT_LOGIN_TOKEN" \
                      > /dev/null

                  echo "Fetching CSRF token..."
                  CSRF=$(curl -fsS -b "$COOKIE_JAR" "$CT_BASE_URL/api/csrftoken" | jq -r '.data')

                  echo "Looking up custom module with shorty=$SHORTY..."
                  MODULE_ID=$(curl -fsS -b "$COOKIE_JAR" "$CT_BASE_URL/api/custommodules" \
                      | jq -r --arg shorty "$SHORTY" '.data[] | select(.shorty == $shorty) | .id')

                  if [ -z "$MODULE_ID" ] || [ "$MODULE_ID" = "null" ]; then
                      echo "No module found with shorty=$SHORTY — creating one."
                      CREATE_PAYLOAD=$(jq -n --arg name "$MODULE_NAME" --arg shorty "$SHORTY" \
                          '{name: $name, shorty: $shorty, sortKey: 0, inMenu: true, description: ""}')
                      MODULE_ID=$(curl -fsS -b "$COOKIE_JAR" \
                          -H "Csrf-Token: $CSRF" \
                          -H 'Content-Type: application/json' \
                          -X POST \
                          -d "$CREATE_PAYLOAD" \
                          "$CT_BASE_URL/api/custommodules" \
                          | jq -r '.data.id')
                      if [ -z "$MODULE_ID" ] || [ "$MODULE_ID" = "null" ]; then
                          echo "::error::Failed to create custom module"
                          exit 1
                      fi
                      echo "Created module ID: $MODULE_ID"
                  else
                      echo "Found existing module ID: $MODULE_ID"
                  fi

                  echo "Uploading $ZIP_PATH..."
                  curl -fsS -b "$COOKIE_JAR" \
                      -H "Csrf-Token: $CSRF" \
                      -F "files[]=@$ZIP_PATH" \
                      "$CT_BASE_URL/api/files/custom_module/$MODULE_ID"

                  echo
                  echo "Upload complete."
