name: Release

on:
    push:
        tags:
            - 'v*.*.*'

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run deploy
              env:
                  VITE_KEY: rr-dashboard
                  VITE_BASE_URL: https://placeholder.church.tools
            - name: Find package
              id: pkg
              run: echo "path=$(ls releases/*.zip | head -1)" >> "$GITHUB_OUTPUT"
            - name: Create GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  files: ${{ steps.pkg.outputs.path }}
                  generate_release_notes: true
